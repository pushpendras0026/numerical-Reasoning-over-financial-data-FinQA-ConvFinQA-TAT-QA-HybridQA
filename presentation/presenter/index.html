<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Presenter</title>
<style>
:root{--bg:#15171a;--panel:#212429;--ink:#f3f1ea;--muted:#9a9ea6;--accent:#eb6834}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,Helvetica,Arial,sans-serif}
/* audience */
body.audience{background:#000;overflow:hidden;cursor:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage img,#stage video{width:100%;height:100%;object-fit:contain}
/* presenter */
#app{display:grid;grid-template-columns:minmax(300px,30%) 1fr;height:100%;gap:16px;padding:16px}
#side{display:flex;flex-direction:column;gap:10px;min-height:0}
#side img{width:100%;display:block;border-radius:4px;background:#000}
.lab{color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
#next{opacity:.8}
#nextbox{min-height:60px;display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:4px;text-align:center;padding:8px}
#clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:600}
#clock small{font-size:15px;color:var(--muted);font-weight:400}
#btns{display:flex;gap:8px;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid #3a3e45;border-radius:4px;padding:8px 12px;font-size:15px;cursor:pointer}
button:hover{border-color:var(--accent)}
#keys{color:var(--muted);font-size:13px;margin-top:auto}
#main{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-radius:6px}
#head{padding:14px 28px;border-bottom:1px solid #3a3e45;display:flex;justify-content:space-between;gap:16px;align-items:baseline}
#title{font-size:22px;font-weight:600}#who{color:var(--accent);white-space:nowrap}
#notes{flex:1;overflow-y:auto;padding:20px 28px 45vh;font-size:var(--fs,30px);line-height:1.45}
#notes p{margin:0 0 .8em}
.part{padding:.3em 0 .1em;opacity:.38;transition:opacity .3s}
.part.on{opacity:1}
.part h3{margin:0 0 .3em;font-size:.65em;color:var(--accent);font-weight:600}
</style></head>
<body>
<script src="data.js"></script>
<script>
const audience = new URLSearchParams(location.search).get('view') === 'audience';
const ch = new BroadcastChannel('presenter');
const img = s => `slides/s-${String(s.n).padStart(2,'0')}.png`;
const VIDEO = '../video/crux.mp4';
const preload = STEPS.filter(s => s.kind === 'slide').forEach(s => { new Image().src = img(s); });

if (audience) {
  document.body.className = 'audience';
  document.title = 'Slides - audience';
  document.body.insertAdjacentHTML('beforeend', '<div id="stage"></div>');
  const stage = document.getElementById('stage');
  let shown = -1, video = null, tick = null;
  function show(i, restart) {
    if (i === shown && !restart) return;
    shown = i; clearInterval(tick); video = null;
    const s = STEPS[i];
    if (s.kind === 'slide') { stage.innerHTML = `<img src="${img(s)}" alt="">`; return; }
    stage.innerHTML = `<video src="${VIDEO}" muted playsinline autoplay></video>`;
    video = stage.firstChild;
    tick = setInterval(() => ch.postMessage({t: video.currentTime, paused: video.paused, ended: video.ended}), 250);
  }
  ch.onmessage = e => {
    const m = e.data;
    if (m.go !== undefined) show(m.go, m.restart);
    if (m.toggle && video) video.paused ? video.play() : video.pause();
  };
  show(0);
  ch.postMessage({hello: 1});
} else {
  document.title = 'Presenter - script';
  document.body.insertAdjacentHTML('beforeend', `
  <div id="app"><div id="side">
    <div class="lab">Now showing</div><img id="cur" alt="">
    <div class="lab">Next</div><div id="next"></div>
    <div id="clock">00:00 <small>target 15:00 to 20:00</small></div>
    <div id="btns"><button id="p">◀ Back</button><button id="n">Next ▶</button><button id="tt">Start timer</button></div>
    <div id="keys">→ or Space: next · ←: back · T: timer · + / −: text size<br>In the video: P pause · V replay</div>
  </div><div id="main"><div id="head"><div id="title"></div><div id="who"></div></div><div id="notes"></div></div></div>`);
  const $ = id => document.getElementById(id);
  let i = 0, fs = 30, started = null, carried = 0;
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function thumb(s){
    if(!s) return '<div id="nextbox">End of presentation</div>';
    return s.kind==='slide' ? `<img src="${img(s)}" alt="">` : `<div id="nextbox">▶ ${esc(s.title)} (4:32)</div>`;
  }
  function render(restart){
    const s = STEPS[i];
    $('title').textContent = (s.kind==='slide' ? `Slide ${s.n} of 16: ${s.title}` : s.title);
    $('who').textContent = s.speaker || '';
    if (s.kind==='slide') { $('cur').src = img(s); $('cur').style.display='';
      $('notes').innerHTML = s.notes.map(p=>`<p>${esc(p)}</p>`).join('');
    } else { $('cur').style.display='none';
      $('notes').innerHTML = s.parts.map((p,k)=>`<div class="part" id="part${k}"><h3>${esc(p.name)}</h3>${p.notes.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`).join('');
      markPart(0);
    }
    $('next').innerHTML = thumb(STEPS[i+1]);
    $('notes').scrollTop = 0;
    ch.postMessage({go:i, restart:!!restart});
  }
  let curPart = -1;
  function markPart(t){
    const s = STEPS[i]; if(s.kind!=='video') return;
    let k = 0; s.parts.forEach((p,j)=>{ if(t>=p.at) k=j; });
    if(k===curPart && document.querySelector('.part.on')) return;
    curPart = k;
    document.querySelectorAll('.part').forEach((e,j)=>e.classList.toggle('on',j===k));
    $('part'+k).scrollIntoView({behavior:'smooth',block:'start'});
  }
  function go(d){ const j=Math.min(STEPS.length-1,Math.max(0,i+d)); if(j!==i){i=j;curPart=-1;render();} }
  window.go = go;
  ch.onmessage = e => { const m=e.data; if(m.hello) render(); if(m.t!==undefined) markPart(m.t); };
  function secs(){return carried+(started?(Date.now()-started)/1000:0)}
  function timer(){ if(started){carried=secs();started=null;$('tt').textContent='Resume timer'} else {started=Date.now();$('tt').textContent='Pause timer'} }
  setInterval(()=>{const x=Math.floor(secs());$('clock').firstChild.textContent=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')} `},500);
  function size(d){fs=Math.min(64,Math.max(18,fs+d));document.documentElement.style.setProperty('--fs',fs+'px')}
  $('n').onclick=()=>go(1); $('p').onclick=()=>go(-1); $('tt').onclick=timer;
  addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(1)}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(-1)}
    else if(k==='t'||k==='T')timer();
    else if(k==='+'||k==='=')size(2);
    else if(k==='-')size(-2);
    else if(k==='p'||k==='P')ch.postMessage({toggle:1});
    else if(k==='v'||k==='V'){curPart=-1;render(true)}
  });
  render();
}
</script>
</body></html>
